<!DOCTYPE html>
<html>
<head>
    <title>Update Ransomware CVEs</title>
<!--    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">-->
<!--    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>-->
<!--    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>-->
<!--    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>-->
        {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
   <script src="{% static 'js/jquery-3.3.1.slim.min.js' %}"></script>
   <script src="{% static 'js/bootstrap.min.js' %}"></script>
   <script src="{% static 'js/popper.min.js' %}"></script>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/cve-list/">CVE List</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="../update/">Update</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="../checklist/">Checklist</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="../ransomware/">Ransomware</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5 text-center">
        <h3>Update Ransomware CVEs</h3><br>
        <p>Latest Published Date: <span id="latest-date">{{ latest_update }}</span></p><br><br>
        <button class="btn btn-primary" id="update-button">Update</button>
        <p id="status-message" class="mt-3"></p><br>
        <div id="new-entries" class="mt-3">
            <!-- New entries will be displayed here -->
        </div>
    </div>
<script>
    document.getElementById("update-button").onclick = function() {
        var updateButton = document.getElementById("update-button");
        var statusMessage = document.getElementById("status-message");
        var newEntriesDiv = document.getElementById("new-entries");

        // Disable the button and change the text to indicate the process is ongoing
        updateButton.disabled = true;
        updateButton.innerText = "Updating...";

        fetch('/cve-list/update-ransomware-cves/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        })
            .then(response => response.json())
            .then(data => {
                // Update the status message and latest date
                statusMessage.innerText = data.message;
                document.getElementById("latest-date").innerText = data.latest_update;

                // Display new entries in a table
                newEntriesDiv.innerHTML = '<h5>New Entries:</h5>';
                if (data.new_cves.length === 0) {
                    newEntriesDiv.innerHTML += '<p>None</p>';
                } else {
                    var table = '<table class="table table-striped"><thead><tr><th scope="col">CVE ID</th></tr></thead><tbody>';
                    data.new_cves.forEach(function(cve_id) {
                        table += '<tr><td>' + cve_id + '</td></tr>';
                    });
                    table += '</tbody></table>';
                    newEntriesDiv.innerHTML += table;
                }

                // Re-enable the button and reset the text
                updateButton.disabled = false;
                updateButton.innerText = "Update Ransomware CVEs";
            })
            .catch(error => {
                // Handle any errors that occur during the fetch
                statusMessage.innerText = "An error occurred. Please try again.";
                updateButton.disabled = false;
                updateButton.innerText = "Update Ransomware CVEs";
                console.error('Error:', error);
            });
    };
</script>

</body>
</html>
