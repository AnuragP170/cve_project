<!DOCTYPE html>
<html>
<head>
    <title>Update CVEs</title>

<!--    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>-->

        {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
   <script src="{% static 'js/jquery-3.3.1.slim.min.js' %}"></script>
   <script src="{% static 'js/bootstrap.min.js' %}"></script>
   <script src="{% static 'js/popper.min.js' %}"></script>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/cve-list/">CVE List</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="../update/">Update</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="../ransomware/">Ransomware</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5 text-center">
    <div class="card mb-4">
            <div class="card-body text-center">
                <h3>Update local CVE list</h3><br>
                <p>Latest Published Date: <span id="latest-date">{{ latest_date }}</span></p><br><br>
                <button class="btn btn-primary" id="update-button">Run</button>
                <p id="status-message" class="mt-3"></p><br>
                <div id="new-entries" class="mt-3">
                    <!-- New entries will be displayed here -->
                </div>


                <br>
                <p><span id="latest-date-1">{{ latest_update }}</span></p><br><br>
                <p id="status-message-1" class="mt-3"></p><br>
                <div id="new-entries-1" class="mt-3">
                    <!-- New entries will be displayed here -->
                </div>
                 <button class="btn btn-primary hidden" id="home-button">Refresh CVE List</button>
             </div>
        </div>
    </div>

   <script>
document.getElementById("update-button").onclick = function() {
    var updateButton = document.getElementById("update-button");
    var statusMessage = document.getElementById("status-message");
    var statusMessage1 = document.getElementById("status-message-1");
    var newEntriesDiv = document.getElementById("new-entries");
    var newEntriesDiv1 = document.getElementById("new-entries-1");

    // Disable the button and change the text to indicate the process is ongoing
    updateButton.disabled = true;
    updateButton.innerText = "Updating...";

    // Fetch for the first update
    fetch('/cve-list/update-cves/')
        .then(response => response.json())
        .then(data => {
            // Update the status message and latest date for the first update
            statusMessage.innerText = data.message;
            document.getElementById("latest-date").innerText = data.latest_date;

            // Display new entries in a table for the first update
            newEntriesDiv.innerHTML = '<h5>New Entries:</h5>';
            if (data.new_entries.length === 0) {
                newEntriesDiv.innerHTML += '<p>None</p>';
            } else {
                var table = '<table class="table table-striped"><thead><tr><th scope="col">CVE ID</th></tr></thead><tbody>';
                data.new_entries.forEach(function(cve_id) {
                    table += '<tr><td>' + cve_id + '</td></tr>';
                });
                table += '</tbody></table>';
                newEntriesDiv.innerHTML += table;
            }
        })
        .catch(error => {
            // Handle any errors that occur during the fetch for the first update
            statusMessage.innerText = "An error occurred. Please try again.";
            console.error('Error:', error);
        });

    // Fetch for the second update
    fetch('/cve-list/update-ransomware-cves/', {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
        .then(response => response.json())
        .then(data => {
            // Update the status message and latest date for the second update
            statusMessage1.innerText = data.message;
            document.getElementById("latest-date-1").innerText = data.latest_update;

            // Display new entries in a table for the second update
            newEntriesDiv1.innerHTML = '<h5>New Entries:</h5>';
            if (data.new_cves.length === 0) {
                newEntriesDiv1.innerHTML += '<p>None</p>';
            } else {
                var table = '<table class="table table-striped"><thead><tr><th scope="col">CVE ID</th></tr></thead><tbody>';
                data.new_cves.forEach(function(cve_id) {
                    table += '<tr><td>' + cve_id + '</td></tr>';
                });
                table += '</tbody></table>';
                newEntriesDiv1.innerHTML += table;
            }
        })
        .catch(error => {
            // Handle any errors that occur during the fetch for the second update
            statusMessage1.innerText = "An error occurred. Please try again.";
            console.error('Error:', error);
        })
        .finally(() => {
            // Re-enable the button and reset the text once both fetch operations are complete
            updateButton.disabled = false;
            updateButton.innerText = "Update CVEs";
        });
};
       document.getElementById("home-button").onclick = function() {
        window.location.href = "/cve-list/new-cves/";
    };

   </script>

<style>
    .card {
    border: 3px solid rgba(0, 0, 0, .125);
    }
</style>
</body>
</html>
